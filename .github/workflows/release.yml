name: Build and Package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_TO_EXTENSION: "src/CloudflareImageUrlGenerator"
  DOTNET_VERSION: '10'

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to nuget.org'
        required: false
        type: boolean
        default: false
      create_github_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: true

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      semver: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      prerelease_id: ${{ steps.calculate-branch.outputs.prerelease_id }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Calculate Branch Slug
        id: calculate-branch
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Current branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
            # Convert branch name to valid semver prerelease identifier
            # Prefix with "00-" to ensure these versions sort before alpha/beta/rc
            # Truncate to keep NuGet paths short, and append a short hash of the full branch name so branches that only differ in punctuation stay distinct
            # Replace feature->ft and hotfix->hf to save more space
            # Trim trailing hyphen if present after truncation
            BRANCH_SLUG=$(echo "$BRANCH_NAME" | sed 's/feature\//ft-/g; s/hotfix\//hf-/g; s/\//-/g' | sed 's/[^A-Za-z0-9-]/-/g' | cut -c 1-7 | sed 's/-$//')-$(printf '%s' "$BRANCH_NAME" | sha1sum | cut -c 1-4)
            PRERELEASE_ID="00-${BRANCH_SLUG}"
            echo "Branch slug: $BRANCH_SLUG"
            echo "Prerelease ID: $PRERELEASE_ID"
            echo "prerelease_id=$PRERELEASE_ID" >> $GITHUB_OUTPUT
          else
            echo "Branch does not match hotfix/* or feature/*, no prerelease ID needed"
            echo "prerelease_id=" >> $GITHUB_OUTPUT
          fi

      - name: Update .releaserc for current branch
        if: ${{ steps.calculate-branch.outputs.prerelease_id != '' }}
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PRERELEASE_ID: ${{ steps.calculate-branch.outputs.prerelease_id }}
        run: |
          echo "Adding branch config: $BRANCH_NAME with prerelease: $PRERELEASE_ID"

          # Read current .releaserc, add the branch entry, and save
          jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
            '.branches += [{"name": $name, "prerelease": $prerelease}]' \
            .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc

          echo "Updated .releaserc:"
          cat .releaserc

      - name: Semantic Release (Dry Run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            conventional-changelog-conventionalcommits@^9

      - name: Check Release
        run: |
          if [ -z "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "::error::No release version generated. Ensure there are conventional commits since the last release."
            exit 1
          fi
          echo "Release version: ${{ steps.semantic.outputs.new_release_version }}"

      - name: Echo the version
        run: |
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-${{ github.ref_name }}-
          nuget-cache-${{ runner.os }}-nuget-

    - name: Update Version Files
      id: update-version
      uses: CrumpledDog/Crumpled.Umbraco.Package.Actions/update-version-files@main
      with:
        semver: ${{ needs.setup.outputs.semver }}
        path-to-extension: ${{ env.PATH_TO_EXTENSION }}

    - name: Dotnet Format check
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Run Unit Tests
      run: dotnet test src/CloudflareImageUrlGenerator.Tests/CloudflareImageUrlGenerator.Tests.csproj --configuration Release

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release /maxcpucount:1

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }} /p:FileVersion=${{ steps.update-version.outputs.file-version }}

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: |
          ${{ env.PATH_TO_EXTENSION }}/bin/Release/*.nupkg
          ${{ env.PATH_TO_EXTENSION }}/bin/Release/*.snupkg
        retention-days: 1

  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [setup, build]
    timeout-minutes: 5
    permissions:
      contents: read   # Required to check out the repo (a job-level permissions block resets unlisted scopes to none)
      id-token: write  # Required for NuGet trusted publishing (OIDC)
      packages: write  # Required for pushing to GitHub Packages
    env:
      MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Publish exactly the commit that was built. If the branch has moved on since this run started,
    # fail rather than publishing packages that do not match what will be tagged.
    - name: Verify branch has not advanced
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        git fetch origin "$BRANCH_NAME"
        REMOTE_SHA=$(git rev-parse "origin/$BRANCH_NAME")
        if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
          echo "::error::$BRANCH_NAME has advanced ($GITHUB_SHA -> $REMOTE_SHA) since this run started. Refusing to publish: the package was built from $GITHUB_SHA. Re-run the workflow on the new commit."
          exit 1
        fi

    - name: Download NuGet Package
      uses: actions/download-artifact@v8
      with:
        name: nuget-package
        path: ./nuget-packages

    - name: Install Package Validation Tool
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        dotnet tool install -g dotnet-validate --prerelease
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Validate NuGet Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        export PATH="$HOME/.dotnet/tools:$PATH"
        dotnet validate package local nuget-packages/Umbraco.Community.CloudflareImageUrlGenerator.*.nupkg

    # A run that fails after packages were pushed (or a branch that advances during the run) can leave a
    # version on the feed that was built from a different commit. A retry can compute the same version from a
    # newer commit, and --skip-duplicate would keep the old package while semantic-release tags the new commit.
    # Refuse that: if the version already exists on GitHub Packages it must have been built from this commit.
    - name: Reject an existing package version built from a different commit
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      env:
        GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for pkg in nuget-packages/*.nupkg; do
          nuspec=$(unzip -p "$pkg" '*.nuspec')
          id=$(echo "$nuspec" | sed -n 's:.*<id>\(.*\)</id>.*:\1:p' | head -1 | tr '[:upper:]' '[:lower:]')
          version=$(echo "$nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -1 | tr '[:upper:]' '[:lower:]')
          status=$(curl -s -o existing.nupkg -w '%{http_code}' -u "USERNAME:$GITHUB_PACKAGES_TOKEN" "https://nuget.pkg.github.com/Jeavon/download/$id/$version/$id.$version.nupkg")
          if [ "$status" = "404" ]; then
            echo "$id $version is not on GitHub Packages yet"
          elif [ "$status" = "200" ]; then
            existing_commit=$(unzip -p existing.nupkg '*.nuspec' | sed -n 's:.*<repository [^>]*commit="\([0-9a-f]*\)".*:\1:p' | head -1)
            if [ "$existing_commit" != "$GITHUB_SHA" ]; then
              echo "::error::$id $version is already on GitHub Packages, built from '$existing_commit' rather than $GITHUB_SHA. Refusing to publish and tag a different commit under the same version. Release a new version instead (push a new commit): this version may also exist on other feeds from the earlier run, so deleting only the GitHub Packages copy is not safe."
              exit 1
            fi
            echo "$id $version already published from this commit, nothing to reconcile"
          else
            echo "::error::Could not check whether $id $version exists on GitHub Packages (HTTP $status)"
            exit 1
          fi
          rm -f existing.nupkg
        done

    - name: Add GitHub Packages Source
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Jeavon/index.json"

    - name: Push GitHub Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget push "nuget-packages/Umbraco.Community.CloudflareImageUrlGenerator.*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate

    - name: Push MyGet Package
      if: needs.setup.outputs.new_release_published == 'true' && env.MYGET_API_KEY != ''
      run: |
        dotnet nuget push "nuget-packages/Umbraco.Community.CloudflareImageUrlGenerator.*.nupkg" --api-key ${{ env.MYGET_API_KEY }} --source https://www.myget.org/F/umbraco-packages/api/v2/package --skip-duplicate
        dotnet nuget push "nuget-packages/Umbraco.Community.CloudflareImageUrlGenerator.*.snupkg" --api-key ${{ env.MYGET_API_KEY }} --source https://www.myget.org/F/umbraco-packages/symbols/api/v2/package --skip-duplicate

    - name: NuGet Trusted Publishing Login
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && startsWith(github.ref, 'refs/heads/release/') && !contains(needs.setup.outputs.semver, '-') }}
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: jeavon

    - name: Push to Nuget.org
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && startsWith(github.ref, 'refs/heads/release/') && !contains(needs.setup.outputs.semver, '-') }}
      run: dotnet nuget push "nuget-packages/Umbraco.Community.CloudflareImageUrlGenerator.*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Write Summary
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: |
        echo "## 📦 Package Built: v${{ needs.setup.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${GITHUB_REF#refs/heads/}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** Ready for release" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [setup, publish]
    if: ${{ needs.setup.outputs.new_release_published == 'true' }}
    permissions:
      contents: write
    env:
      SEMVER: ${{ needs.setup.outputs.semver }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Fetch all tags
      run: git fetch --force --tags

    # Release exactly the commit that was built, tested and published. If the branch has moved on since this
    # run started, fail rather than letting semantic-release analyse and tag commits that were never built
    # (a newer feat or breaking commit could also change the computed version).
    - name: Verify branch has not advanced
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        git fetch origin "$BRANCH_NAME"
        REMOTE_SHA=$(git rev-parse "origin/$BRANCH_NAME")
        if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
          echo "::error::$BRANCH_NAME has advanced ($GITHUB_SHA -> $REMOTE_SHA) since this run started. Refusing to tag: the package was built from $GITHUB_SHA. If that package was already published, tag that commit manually (git tag v${SEMVER} $GITHUB_SHA && git push origin v${SEMVER}) and create the release from it; otherwise re-run on the new commit."
          exit 1
        fi

    - name: Update .releaserc for current branch
      if: ${{ needs.setup.outputs.prerelease_id != '' }}
      env:
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        PRERELEASE_ID: ${{ needs.setup.outputs.prerelease_id }}
      run: |
        echo "Adding branch config: $BRANCH_NAME with prerelease: $PRERELEASE_ID"

        # Read current .releaserc, add the branch entry, and save
        jq --arg name "$BRANCH_NAME" --arg prerelease "$PRERELEASE_ID" \
          '.branches += [{"name": $name, "prerelease": $prerelease}]' \
          .releaserc > .releaserc.tmp && mv .releaserc.tmp .releaserc

    # semantic-release pushes the tag first and its "notes" ref (refs/notes/semantic-release-v*) last. A transient
    # GitHub rejection of that final push fails the step even though the tag exists, which previously skipped the
    # GitHub Release and the merge back to develop. Tolerate the failure here and verify the tag explicitly below.
    - name: Semantic Release
      id: semantic
      continue-on-error: true
      uses: cycjimmy/semantic-release-action@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        dry_run: false
        extra_plugins: |
          @semantic-release/exec
          @semantic-release/commit-analyzer
          @semantic-release/release-notes-generator
          conventional-changelog-conventionalcommits@^9

    - name: Confirm tag and notes
      id: confirm
      env:
        SEMANTIC_OUTCOME: ${{ steps.semantic.outcome }}
      run: |
        # Check the tag on the remote itself: a tag created locally by a failed semantic-release push must not count.
        TAG_SHA=$(git ls-remote origin "refs/tags/v${SEMVER}" "refs/tags/v${SEMVER}^{}" | tail -1 | cut -f1)
        if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
          echo "::error::The remote tag v${SEMVER} does not point at $GITHUB_SHA (remote tag commit: '${TAG_SHA}', semantic-release outcome: ${SEMANTIC_OUTCOME})."
          exit 1
        fi
        echo "Remote tag v${SEMVER} points at $GITHUB_SHA"

        if [ "$SEMANTIC_OUTCOME" != "success" ]; then
          echo "::warning::semantic-release failed after creating tag v${SEMVER}; retrying the notes ref push."
          pushed=false
          if git show-ref --verify -q "refs/notes/semantic-release-v${SEMVER}"; then
            for attempt in 1 2 3; do
              if git push origin "refs/notes/semantic-release-v${SEMVER}"; then pushed=true; break; fi
              echo "Notes push attempt $attempt failed"
              sleep $((attempt * 5))
            done
          fi
          if [ "$pushed" != "true" ]; then
            echo "notes_failed=true" >> $GITHUB_OUTPUT
          fi
        fi

    # Reuses semantic-release's own generated notes when available, otherwise falls back to GitHub's generator.
    - name: Generate Release Notes Body
      if: ${{ github.event.inputs.create_github_release != 'false' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        RELEASE_NOTES: ${{ steps.semantic.outputs.new_release_notes }}
        PUBLISH_TO_NUGET: ${{ github.event.inputs.publish_to_nuget }}
      run: |
        # Check if this is a feature or hotfix branch test release
        if [[ "$BRANCH_NAME" == hotfix/* ]] || [[ "$BRANCH_NAME" == feature/* ]]; then
          echo "## ⚠️ Test Release from \`$BRANCH_NAME\`" > release_body.md
          echo "" >> release_body.md
          echo "This is a test release for development and testing purposes only." >> release_body.md
          echo "" >> release_body.md
          echo "### Installation" >> release_body.md
          echo "" >> release_body.md
          cat << EOF >> release_body.md
        \`\`\`bash
        dotnet add package Umbraco.Community.CloudflareImageUrlGenerator --version ${SEMVER} --source https://nuget.pkg.github.com/Jeavon/index.json
        \`\`\`
        EOF
        # Check if publishing to nuget.org (stable release)
        elif [[ "$PUBLISH_TO_NUGET" == "true" && "$SEMVER" != *"-"* ]]; then
          cat << EOF > release_body.md
        ## Installation

        \`\`\`bash
        dotnet add package Umbraco.Community.CloudflareImageUrlGenerator --version ${SEMVER}
        \`\`\`
        EOF
        else
          # Pre-release - show alternative sources
          cat << EOF > release_body.md
        ## Installation

        ### From MyGet (pre-release)

        \`\`\`bash
        dotnet add package Umbraco.Community.CloudflareImageUrlGenerator --version ${SEMVER} --source https://www.myget.org/F/umbraco-packages/api/v3/index.json
        \`\`\`

        ### From GitHub Packages (pre-release)

        \`\`\`bash
        dotnet add package Umbraco.Community.CloudflareImageUrlGenerator --version ${SEMVER} --source https://nuget.pkg.github.com/Jeavon/index.json
        \`\`\`
        EOF
        fi

        # Stable releases always use GitHub's generated notes: semantic-release's default preset omits chore/ci/build/refactor
        # commits that the analyzer still counts as releases. Also used when semantic-release produced no notes.
        if [ -z "$RELEASE_NOTES" ] || [[ "$SEMVER" != *"-"* ]]; then
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^v${SEMVER}$" | head -n1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            RELEASE_NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -F tag_name="v${SEMVER}" -F previous_tag_name="$PREVIOUS_TAG" --jq .body || true)
          else
            RELEASE_NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -F tag_name="v${SEMVER}" --jq .body || true)
          fi
        fi

        printf '\n---\n\n%s\n' "$RELEASE_NOTES" | sed '/^#\+ \[/d' >> release_body.md

    - name: Update GitHub Release with Custom Notes
      if: ${{ github.event.inputs.create_github_release != 'false' }}
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.setup.outputs.semver }}
        name: v${{ needs.setup.outputs.semver }}
        body_path: release_body.md
        prerelease: ${{ contains(needs.setup.outputs.semver, '-') }}

    - name: Make merge script executable
      if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
      # Git doesn't reliably track the executable bit for files committed from Windows.
      run: chmod +x .github/scripts/merge-to-develop.sh

    - name: Merge release branch to develop
      if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
      run: .github/scripts/merge-to-develop.sh "${{ needs.setup.outputs.semver }}"

    - name: Fail if the notes ref was not persisted
      if: ${{ steps.confirm.outputs.notes_failed == 'true' }}
      run: |
        echo "::error::The release v${SEMVER} was tagged, published and merged back, but refs/notes/semantic-release-v${SEMVER} could not be pushed. Repair it before the next release: git notes --ref=semantic-release-v${SEMVER} add -m '{\"channels\":[null]}' v${SEMVER} && git push origin refs/notes/semantic-release-v${SEMVER} (use the branch name instead of null for prerelease channels)."
        exit 1

    - name: Write Summary
      run: |
        echo "## 🚀 Release Published: v${{ needs.setup.outputs.semver }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** \`${GITHUB_REF#refs/heads/}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** \`v${{ needs.setup.outputs.semver }}\`" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ github.event.inputs.create_github_release }}" == "false" ]]; then
          echo "**Note:** GitHub Release creation was skipped (create_github_release=false)" >> $GITHUB_STEP_SUMMARY
        fi
